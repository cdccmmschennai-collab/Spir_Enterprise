# SPIR Dynamic Extraction — local Docker Desktop stack (Phase 1).
#
#   docker compose up --build
#
#   Frontend : http://localhost:3000
#   API      : http://localhost:8000   (health: /api/health, docs: /api/docs when DEBUG=true)
#
# Reproduces the production topology:
#   frontend → api → db / redis ; redis → worker-normal / worker-heavy / worker-giant / beat
# Queue routing (batch_router.py + config.py):
#   normal  ≤ 100 MB   heavy 100–500 MB   giant > 500 MB
#
# Redis: the `redis` service below is the ONE SPIR Redis on this machine
# (published on host 6379). The Docker stack uses logical DB /1; the native
# (non-Docker) stack keeps using redis://localhost:6379/0, so neither can
# consume the other's Celery tasks or results.
#
# MinIO (Phase 3A infra, Phase 3C workflow): the `minio` service holds the
# source workbooks the API hands to the Celery workers (UPLOAD_STORAGE_BACKEND
# below). Extracted rows / avatars are not migrated. `minio-init` creates the
# bucket idempotently (mirrors db-init) and exits 0.
#
#   MinIO S3 API : http://127.0.0.1:9000   (host-local only, e.g. for `mc`)
#   MinIO console: http://127.0.0.1:9001   (host-local only)
#
# The monitoring stack stays separate: docker-compose.monitoring.yml
#
# Overridable interpolation variables (set in the shell or in the repo-root .env,
# which Compose reads automatically): POSTGRES_USER, POSTGRES_PASSWORD, POSTGRES_DB,
# APP_USER, APP_PASS, SECRET_KEY, DEBUG, LOG_LEVEL, LOG_FORMAT, CLEANUP_DRY_RUN,
# MINIO_ROOT_USER, MINIO_ROOT_PASSWORD, MINIO_BUCKET.

name: spir

x-backend-env: &backend-env
  # Container-to-container addresses — Compose service names, never localhost.
  DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-spir_user}:${POSTGRES_PASSWORD:-strongpassword}@db:5432/${POSTGRES_DB:-spir_db}
  # Logical DB /1 (native stack = /0). Every Redis consumer (Celery
  # broker/backend, job store, RedisStorage, delivery keys) reads this one
  # setting, so /1 isolates the whole Docker stack.
  REDIS_URL: redis://redis:6379/1
  CELERY_ENABLED: "true"
  # Absolute paths inside the container (shared spir_storage volume). These match
  # what config.py would resolve anyway; explicit so the API/worker paths can
  # never diverge.
  ROWS_STORAGE_PATH: /opt/spir_dynamic/storage/extracted_rows
  BATCH_UPLOAD_DIR: /opt/spir_dynamic/storage/batch_uploads
  # Auth bootstrap — used only until a super_admin exists in the DB.
  APP_USER: ${APP_USER:-admin}
  APP_PASS: ${APP_PASS:-admin123}
  SECRET_KEY: ${SECRET_KEY:-local-docker-dev-secret-change-me}
  # Same values as the native local .env files
  DEBUG: ${DEBUG:-true}
  LOG_LEVEL: ${LOG_LEVEL:-INFO}
  LOG_FORMAT: ${LOG_FORMAT:-text}
  BATCH_TTL_SECONDS: "7200"
  MAX_CONCURRENT_EXTRACTIONS: "4"
  EXTRACTION_TIMEOUT_SECONDS: "600"
  SANITIZER_ENABLED: "true"
  SANITIZER_THRESHOLD_MB: "25"
  LARGE_FILE_THRESHOLD_MB: "100"
  GIANT_FILE_THRESHOLD_MB: "500"
  CLEANUP_JSON_RETENTION_DAYS: "14"
  CLEANUP_UPLOAD_STALE_HOURS: "24"
  CLEANUP_DRY_RUN: ${CLEANUP_DRY_RUN:-true}
  # Object storage (Phase 3A) — connection settings. Compose service name +
  # container port, never localhost.
  MINIO_ENDPOINT: http://minio:9000
  MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-spir_minio}
  MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-spir_minio_dev_password}
  MINIO_BUCKET: ${MINIO_BUCKET:-spir-files}
  MINIO_SECURE: "false"
  # Phase 3C: the uploads handed to the Celery workers (large single files,
  # every batch file) are stored in MinIO under batch_uploads/<key>; workers
  # download them to a temp file for openpyxl. Extracted rows and avatars stay
  # on the spir_storage volume (STORAGE_BACKEND is still filesystem). Set to
  # "filesystem" to fall back to the shared batch_uploads directory.
  UPLOAD_STORAGE_BACKEND: ${UPLOAD_STORAGE_BACKEND:-minio}
  # Phase 3D: large uploads (> LARGE_FILE_THRESHOLD_MB) go browser -> MinIO
  # through presigned URLs. Those URLs must point at an address the BROWSER
  # can reach, which is not the Compose name above: locally that is the
  # host-published MinIO port. In production set it to the HTTPS host that
  # fronts MinIO (Nginx must pass `Host` through unchanged — the signature
  # covers it). MINIO_ENDPOINT stays the container-to-container address.
  # Leave empty to disable direct upload (everything streams through the API).
  MINIO_PUBLIC_ENDPOINT: ${MINIO_PUBLIC_ENDPOINT:-http://localhost:9000}
  # The URLs are signed with this scoped MinIO user (created by minio-init,
  # policy limited to batch_uploads/*), so the root access-key id never
  # appears in a browser. Only the API uses these; workers ignore them.
  MINIO_PRESIGN_ACCESS_KEY: ${MINIO_UPLOADER_USER:-spir_uploader}
  MINIO_PRESIGN_SECRET_KEY: ${MINIO_UPLOADER_PASSWORD:-spir_uploader_dev_password}
  DIRECT_UPLOAD_ENABLED: ${DIRECT_UPLOAD_ENABLED:-true}
  DIRECT_UPLOAD_PART_SIZE_MB: "16"
  DIRECT_UPLOAD_URL_TTL_SECONDS: "3600"

x-backend-base: &backend-base
  build:
    context: .
    dockerfile: Dockerfile
  image: spir-backend
  environment: *backend-env
  volumes:
    # One shared volume for the whole storage tree: the worker writes
    # storage/extracted_rows/<file_id>.json, avatars live here, and
    # storage/batch_uploads is the upload staging area whenever
    # UPLOAD_STORAGE_BACKEND=filesystem (with minio it stays empty).
    - spir_storage:/opt/spir_dynamic/storage
  restart: unless-stopped

services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # Baked into the browser bundle at build time — must be reachable from
        # the browser, i.e. the published API port on the Windows host.
        NEXT_PUBLIC_API_URL: http://localhost:8000
    image: spir-frontend
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  # One-shot schema bootstrap. Runs the app's own init_db.initialize() (create
  # tables + idempotent schema sync + seed branches/admin) exactly once before
  # the API starts. Without it, the 4 uvicorn workers race each other on
  # create_all on a fresh database and the losers silently drop into "no-DB
  # legacy mode". Production never hits this because the schema already exists.
  db-init:
    <<: *backend-base
    restart: "no"
    command:
      - python
      - -c
      - |
        import asyncio, sys
        from spir_dynamic.app.config import get_settings
        from spir_dynamic.db.init_db import initialize
        s = get_settings()
        ok = asyncio.run(initialize(s.database_url, s.app_user, s.app_pass))
        print("db-init:", "ok" if ok else "FAILED")
        sys.exit(0 if ok else 1)
    depends_on:
      db:
        condition: service_healthy

  api:
    <<: *backend-base
    # Mirrors deploy/spir-api.service (4 uvicorn workers). --proxy-headers is
    # omitted because there is no Nginx in front of the container locally.
    command:
      - uvicorn
      - spir_dynamic.app.main:app
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --workers
      - "4"
      - --access-log
      - --log-level
      - info
    ports:
      - "8000:8000"
    depends_on:
      # The lifespan hook falls back to "no-DB legacy mode" if Postgres is not
      # reachable at startup, so wait for the healthchecks rather than racing.
      db:
        condition: service_healthy
      db-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import sys, urllib.request; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=5).status == 200 else 1)"
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  # ── Celery workers — one per queue (normal / heavy / giant) ────────────────
  worker-normal:
    <<: *backend-base
    # Same settings as deploy/spir-worker.service (concurrency=2,
    # max-tasks-per-child=25). Also consumes the default "celery" queue: Beat's
    # lifecycle_cleanup and the ping smoke-test task are sent without an explicit
    # queue, so without this no worker would ever pick them up.
    command:
      - celery
      - -A
      - spir_dynamic.celery_app
      - worker
      - --loglevel=info
      - -Q
      - normal,celery
      - --concurrency=2
      - --max-tasks-per-child=25
      - --hostname=spir-normal@%h
    depends_on:
      redis:
        condition: service_healthy
      db:
        condition: service_healthy

  worker-heavy:
    <<: *backend-base
    # 100–500 MB files. One process at a time; recycling/memory cap come from
    # celery_app.py (worker_max_tasks_per_child=25, worker_max_memory_per_child=1 GB).
    command:
      - celery
      - -A
      - spir_dynamic.celery_app
      - worker
      - --loglevel=info
      - -Q
      - heavy
      - --concurrency=1
      - --hostname=spir-heavy@%h
    depends_on:
      redis:
        condition: service_healthy
      db:
        condition: service_healthy

  worker-giant:
    <<: *backend-base
    # > 500 MB files. config.py: "dedicated single-concurrency worker ... recycled
    # after every task so openpyxl memory does not accumulate".
    command:
      - celery
      - -A
      - spir_dynamic.celery_app
      - worker
      - --loglevel=info
      - -Q
      - giant
      - --concurrency=1
      - --max-tasks-per-child=1
      - --hostname=spir-giant@%h
    depends_on:
      redis:
        condition: service_healthy
      db:
        condition: service_healthy

  beat:
    <<: *backend-base
    # Schedule defined in celery_app.py (lifecycle-cleanup-daily, 02:00 UTC).
    # The schedule state file goes to /tmp — it is derived state, not data.
    command:
      - celery
      - -A
      - spir_dynamic.celery_app
      - beat
      - --loglevel=info
      - --schedule=/tmp/celerybeat-schedule
    depends_on:
      redis:
        condition: service_healthy

  redis:
    # Pinned to the 8.x line: the data was migrated from the former standalone
    # `spir-redis` container (Redis 8.6), and RDB files are not backward
    # compatible with older majors.
    image: redis:8-alpine
    # AOF persistence: queued tasks, batch job state and cached results survive
    # a Redis restart.
    command: redis-server --appendonly yes --appendfsync everysec
    volumes:
      - redis_data:/data
    ports:
      # Same host port the standalone container used, so the native (non-Docker)
      # stack's redis://localhost:6379/0 keeps working unchanged.
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  db:
    image: postgres:15
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-spir_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-strongpassword}
      POSTGRES_DB: ${POSTGRES_DB:-spir_db}
    volumes:
      - pg_data:/var/lib/postgresql/data
    ports:
      # Host 5432 = native PostgreSQL 18 service, 5433 = wms-db-1; the host side
      # is shifted to 5434, container port stays 5432.
      - "5434:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-spir_user} -d ${POSTGRES_DB:-spir_db}"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped

  # ── MinIO object storage (Phase 3A — infrastructure only) ─────────────────
  minio:
    # Official image moved from Docker Hub to quay.io. Pinned release; `latest`
    # resolved to this tag on 2026-09-16.
    image: quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      # Root credentials. Override in the repo-root .env (gitignored) — the
      # defaults are development placeholders only. MinIO requires >= 8 chars.
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-spir_minio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-spir_minio_dev_password}
      # Phase 3D: the browser PUTs upload parts straight to this service, so
      # its S3 API must answer CORS for the frontend origin — and only that
      # origin (MinIO's default is "*"). Comma-separated for several origins.
      MINIO_API_CORS_ALLOW_ORIGIN: ${MINIO_CORS_ALLOW_ORIGIN:-http://localhost:3000}
      # MinIO's own reclaim of multipart uploads nobody completed or aborted.
      # These are MinIO's defaults, written out so the policy is visible and
      # matches CLEANUP_UPLOAD_STALE_HOURS=24 above; the lifecycle cleanup
      # task aborts the ones the API indexed, MinIO catches the rest.
      MINIO_API_STALE_UPLOADS_EXPIRY: 24h
      MINIO_API_STALE_UPLOADS_CLEANUP_INTERVAL: 6h
    volumes:
      - minio_data:/data
    ports:
      # Bound to localhost only — reachable from this machine for `mc`, the
      # console and (Phase 3D) the browser's direct part uploads via
      # MINIO_PUBLIC_ENDPOINT=http://localhost:9000; never from the LAN.
      # Containers use http://minio:9000 over the Compose network. 9000/9001
      # were free on this host (9090/9100 belong to the monitoring stack).
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    healthcheck:
      # `mc` ships inside the server image; `mc ready local` is MinIO's
      # documented readiness probe.
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped

  # One-shot bucket bootstrap (same pattern as db-init). `mc mb --ignore-existing`
  # is idempotent: re-running on every `up` is a no-op once the bucket exists,
  # and it never deletes or recreates anything. Exited (0) is the expected state.
  #
  # Phase 3D also provisions the scoped `spir_uploader` user the API signs the
  # browser's part URLs with. Its policy allows exactly the multipart-part
  # write on batch_uploads/* and nothing else in the bucket, so a leaked URL
  # (or the key id every presigned URL carries) can never read, list or
  # delete anything. `user add` / `policy create` overwrite idempotently;
  # `policy attach` errors when already attached, hence the info check.
  minio-init:
    image: quay.io/minio/mc:RELEASE.2025-08-13T08-35-41Z
    restart: "no"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-spir_minio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-spir_minio_dev_password}
      MINIO_BUCKET: ${MINIO_BUCKET:-spir-files}
      MINIO_UPLOADER_USER: ${MINIO_UPLOADER_USER:-spir_uploader}
      MINIO_UPLOADER_PASSWORD: ${MINIO_UPLOADER_PASSWORD:-spir_uploader_dev_password}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -eu
        mc alias set spir http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD"
        mc mb --ignore-existing "spir/$$MINIO_BUCKET"
        # The mc image is ubi-micro (no grep/curl); `mc ls` on a missing
        # bucket exits non-zero, which is the verification we need.
        mc ls "spir/$$MINIO_BUCKET" > /dev/null
        echo "minio-init: bucket '$$MINIO_BUCKET' ready"
        printf '%s' '{"Version":"2012-10-17","Statement":[{"Effect":"Allow","Action":["s3:PutObject","s3:AbortMultipartUpload","s3:ListMultipartUploadParts"],"Resource":["arn:aws:s3:::'"$$MINIO_BUCKET"'/batch_uploads/*"]}]}' > /tmp/spir-uploader.json
        mc admin policy create spir spir-uploader /tmp/spir-uploader.json
        mc admin user add spir "$$MINIO_UPLOADER_USER" "$$MINIO_UPLOADER_PASSWORD"
        case "$$(mc admin user info spir "$$MINIO_UPLOADER_USER" --json)" in
          *spir-uploader*) ;;
          *) mc admin policy attach spir spir-uploader --user "$$MINIO_UPLOADER_USER" ;;
        esac
        echo "minio-init: uploader '$$MINIO_UPLOADER_USER' ready (policy spir-uploader)"
    depends_on:
      minio:
        condition: service_healthy

volumes:
  # Survive `docker compose down` / `up`. Only `down -v` deletes them.
  spir_storage:
  redis_data:
  pg_data:
  minio_data:
