# SPIR Dynamic — Log rotation configuration
#
# DEPLOY:
#   sudo cp deploy/logrotate-spir.conf /etc/logrotate.d/spir-api
#   sudo logrotate -d /etc/logrotate.d/spir-api   # dry-run to verify
#   sudo logrotate -f /etc/logrotate.d/spir-api   # force a manual run
#
# ── Systemd journal (spir-api, spir-worker) ────────────────────
# journald is NOT managed by logrotate — configure it in:
#   /etc/systemd/journald.conf
#
# Add or edit these lines:
#   [Journal]
#   SystemMaxUse=500M
#   SystemKeepFree=200M
#   MaxRetentionSec=30day
#
# Apply:
#   sudo systemctl restart systemd-journald
#
# Verify:
#   journalctl --disk-usage
# ────────────────────────────────────────────────────────────────

# ── Nginx SPIR-specific access and error logs ──────────────────
# 30-day retention: one daily rotation kept for 30 days = ~1 month of access logs.
# compress + delaycompress: gzip previous rotation, not the just-rotated file
# (gives nginx one cycle to finish writing before compression).
/var/log/nginx/spir_access.log
/var/log/nginx/spir_error.log {
    daily
    missingok
    rotate 30
    compress
    delaycompress
    notifempty
    sharedscripts
    postrotate
        # Signal nginx to reopen log files after rotation.
        # Uses PID file; falls back gracefully if nginx is not running.
        if [ -f /var/run/nginx.pid ]; then
            kill -USR1 $(cat /var/run/nginx.pid)
        fi
    endscript
}

# ── Nginx default access/error logs (if not separated per-vhost) ─
/var/log/nginx/access.log
/var/log/nginx/error.log {
    daily
    missingok
    rotate 30
    compress
    delaycompress
    notifempty
    sharedscripts
    postrotate
        if [ -f /var/run/nginx.pid ]; then
            kill -USR1 $(cat /var/run/nginx.pid)
        fi
    endscript
}

# ── PM2 frontend logs ──────────────────────────────────────────
# copytruncate is safe for PM2 because PM2 holds the file open continuously.
# It copies the log then truncates in place — no reopen signal needed.
/var/log/pm2/spir-frontend-out.log
/var/log/pm2/spir-frontend-error.log {
    daily
    missingok
    rotate 14
    compress
    delaycompress
    notifempty
    copytruncate
}
